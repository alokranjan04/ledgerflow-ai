name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloud Run after the gates pass"
        type: boolean
        default: false
  schedule:
    - cron: "30 2 * * *"      # nightly: LLM evals against the live model

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - name: Lint
        run: ruff check .
      - name: Tests + traceability gate (every MUST requirement has a passing test)
        run: python scripts/trace_matrix.py
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/

  evals:
    # Real-model evaluation: tool choice, numeric exactness, grounding. Needs GEMINI_API_KEY.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LOG_JSON: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Start the service
        run: |
          python app.py > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8080/readyz && break; sleep 1; done
      - name: Golden-set evaluation
        run: python scripts/eval.py --url http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: |
            reports/
            server.log

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: gates
    runs-on: ubuntu-latest
    environment: production          # protected environment: required reviewers
    permissions:
      contents: read
      id-token: write                # Workload Identity Federation (no JSON keys)
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy (secrets already in Secret Manager)
        run: |
          gcloud run deploy ledgerflow-ai --source=. --region=asia-south1 --project=${{ vars.GCP_PROJECT }} \
            --service-account=ledgerflow-ai-runtime@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com --quiet
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ledgerflow-ai --region=asia-south1 --project=${{ vars.GCP_PROJECT }} --format='value(status.url)')
          curl -fsS "$URL/readyz"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/mock/crm/customers/C1001")" = "403"
